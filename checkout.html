<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopEasy</title>
    <meta name="description" content="Checkout at ShopEasy. Secure payment processing.">
    <meta name="robots" content="noindex, follow">
    <meta property="og:title" content="Checkout - ShopEasy">
    <meta property="og:url" content="https://shop2026easy.com/checkout.html">
    <link rel="canonical" href="https://shop2026easy.com/payment.html">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <meta name="theme-color" content="#FFD700">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f8f9fa; margin: 0; }
        .redirect-box { text-align: center; padding: 40px; }
        .redirect-box i { font-size: 3rem; color: #667eea; margin-bottom: 20px; }
        .redirect-box h2 { font-size: 1.4rem; color: #333; margin-bottom: 10px; }
        .redirect-box p { color: #888; font-size: 0.95rem; }
        .redirect-box a { color: #667eea; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="redirect-box">
        <i class="fas fa-sync fa-spin"></i>
        <h2>Redirecting to Checkout...</h2>
        <p>If you are not redirected, <a href="payment.html">click here</a>.</p>
    </div>
    <script>
    // Check if cart has items before redirecting
    try {
        const saved = localStorage.getItem('shopEasyCart');
        if (saved) {
            const cart = JSON.parse(saved);
            const hasItems = Array.isArray(cart) ? cart.length > 0 : (cart.items && cart.items.length > 0);
            if (!hasItems) {
                document.querySelector('.redirect-box').innerHTML = 
                    '<i class="fas fa-shopping-cart" style="color:#ddd"></i><h2>Your cart is empty</h2><p>Add some products first!</p><a href="products.html" style="display:inline-block;margin-top:15px;padding:12px 30px;background:#667eea;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;">Browse Products</a>';
            } else {
                window.location.href = 'payment.html';
            }
        } else {
            window.location.href = 'payment.html';
        }
    } catch(e) {
        window.location.href = 'payment.html';
    }
    </script>
</body>
</html>
